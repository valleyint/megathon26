[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "commons-category-suggester"
version = "0.1.0"
description = "Cascaded multi-scorer retrieval and hierarchical verification for Wikimedia Commons"
authors = [{ name = "Team 23", email = "team23@megathon.local" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pillow>=9.5.0",
    "torch>=2.0.0",
    "transformers>=4.38.0",
    "faiss-cpu>=1.7.4",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
